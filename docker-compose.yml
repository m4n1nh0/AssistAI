services:
  mysql:
    image: mysql:8.4
    container_name: assistai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: assistai
      MYSQL_USER: assistai
      MYSQL_PASSWORD: assistai
      MYSQL_ROOT_PASSWORD: assistai_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: assistai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
    container_name: assistai-backend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      ASSISTAI_MYSQL_URL: mysql+pymysql://assistai:assistai@mysql:3306/assistai
      ASSISTAI_QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: assistai-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
  qdrant_data:

