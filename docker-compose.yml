services:
  mysql:
    image: mysql:8.4
    container_name: atendimento_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: atendimento
      MYSQL_USER: assistente
      MYSQL_PASSWORD: assistente
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: atendimento_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data:
