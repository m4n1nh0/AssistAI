[project]
name = "assistai-backend"
version = "0.1.0"
description = "Backend FastAPI para a POC AssistAI."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
database = [
  "alembic>=1.13.0",
  "pymysql>=1.1.1",
  "sqlalchemy>=2.0.0"
]
ai = [
  "langgraph>=0.2.0",
  "qdrant-client>=1.11.0"
]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
